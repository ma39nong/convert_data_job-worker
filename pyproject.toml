[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convert-data-job-worker"
version = "0.1.0"
description = "Automatic removal of dual-arm idle intervals from ROS2 bags"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "rosbags>=0.11.5,<0.12"]

[project.optional-dependencies]
test = ["pytest>=8"]
preview = ["opencv-python-headless>=4.8"]

[project.scripts]
bag-worker = "bag_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
