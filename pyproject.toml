[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convert-data-job-worker"
version = "0.2.1"
description = "Resumable ROS2 bag cleaning and multimodal LeRobot v2.1 conversion"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "rosbags>=0.11.5,<0.12"]

[project.optional-dependencies]
test = ["pytest>=8"]
conversion = ["pyarrow==19.0.1", "av==14.2.0"]
training = ["pyarrow==19.0.1", "av==14.2.0", "scipy>=1.13,<2", "numba>=0.60,<1"]
preview = ["opencv-python-headless>=4.8"]

[project.scripts]
bag-worker = "bag_worker.cli:main"
convert-worker = "convest.cli:main"
ingest-worker = "convest.ingest.cli:main"
workflow-gui = "convest.gui.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"convest.gui" = ["static/*.html", "static/*.css", "static/*.js", "static/*.gif"]
