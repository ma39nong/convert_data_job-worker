<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>番茄 · 阶段标注</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div><span class="brand">番茄 <b>／</b> 阶段标注</span><span class="tag">NORMAL ↔ SPEEDUP</span></div><a href="/models" target="_blank" rel="noopener">配置视觉模型</a><span id="connection">正在连接…</span></header>
<div class="workspace">
<aside><div class="section-title">录制片段 <span id="count"></span></div><input id="search" placeholder="筛选机器人、版本、批次" aria-label="筛选片段"><div id="episodes"></div><div class="aside-note">原始数据只读<br>标签与修改历史另存<br><span id="output"></span></div></aside>
<main>
<div class="heading"><div><p class="eyebrow">SUBTASK REVIEW</p><h1 id="title">选择一条录制开始审核</h1><p id="subtitle"></p></div><div id="status" class="pill">未载入</div></div>
<div id="message" role="status">先确认少量样例，再自动预标注。自动生成的标签均需人工审核。</div>
<div class="videos" id="videos"></div>
<div class="transport"><button id="previousFrame" title="左方向键">−1帧</button><button id="play">播放</button><button id="nextFrame" title="右方向键">+1帧</button><span id="time">0.00 / 0.00 秒</span><label>帧 <input id="frame" type="number" min="0" value="0"></label><button id="jump">定位</button><select id="rate" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>
<input id="seek" type="range" min="0" max="1" value="0" step="1" aria-label="播放定位">
<div class="timeline-title"><span>粗阶段</span><span>点击色块定位 · 区间采用 [开始帧, 结束帧)</span></div><div id="coarseTrack" class="track"></div>
<div class="timeline-title"><span>细动作</span><span id="progress"></span></div><div id="fineTrack" class="track fine"></div>
<div class="editor-grid"><section class="panel"><div class="section-title">当前片段 <span id="segmentNumber"></span></div>
<div class="fields"><label>开始帧<input id="start" type="number" min="0"></label><label>结束帧<input id="end" type="number" min="1"></label><button id="boundary">更新边界</button></div>
<label class="block">细动作<select id="label"></select></label><div id="coarseLabel" class="muted"></div><label class="check"><input id="reviewed" type="checkbox"> 已看片确认此片段与边界</label>
<div class="button-row"><button id="split">在当前帧拆分 <kbd>M</kbd></button><button id="merge">合并下一段</button><button id="nextPending">下一待审核段</button></div><p id="score" class="muted"></p>
</section><section class="panel"><div class="section-title">预标注与交付</div><p class="muted">三路画面与机器人姿态共同检索。分差表示样例相似度，不代表正确概率。</p><label class="block">预标注方式<select id="backend"><option value="local">本地样例检索（试验）</option><option value="jev" disabled>JEV 多相机视觉识别（需配置）</option></select></label><p id="jevStatus" class="muted"></p><div class="button-row"><button id="jevPlan">生成 JEV 请求计划</button></div><div class="button-row"><button id="predict" class="accent">自动预标注</button><button id="train">从已确认片段学习</button></div>
<div class="button-row"><button id="save" class="primary">保存标注</button><button id="download">下载 JSON</button></div><label class="block">整条任务结果<select id="outcome"><option value="unknown">尚未判断</option><option value="success">确认全部完成</option><option value="failure">任务失败</option><option value="incomplete">录制未完成整个任务</option></select></label>
<label class="block">对应的 speedup<select id="target"><option value="">选择同源 speedup 片段</option></select></label><button id="project">将 normal 标签映射到 speedup</button>
</section></div>
<div class="segment-list"><div class="section-title">全部动作片段</div><div id="segments"></div></div>
<footer>空格 播放／暂停 · ← → 逐帧 · M 拆分 · Ctrl/Cmd+S 保存 · 点击片段后修改标签或边界</footer>
</main></div><script src="/app.js"></script></body></html>
